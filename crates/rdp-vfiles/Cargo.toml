[package]
name = "rdp-vfiles"
description = "Files from the other end of an RDP session, offered to Windows apps as an OLE data object (paste and drag)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
rdp-companion-proto = { path = "../rdp-companion-proto" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
