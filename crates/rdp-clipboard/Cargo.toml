[package]
name = "rdp-clipboard"
description = "Windows clipboard redirection (CLIPRDR backend), adapted from IronRDP's ironrdp-cliprdr-native."
edition.workspace = true
version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
ironrdp-cliprdr.workspace = true
ironrdp-core.workspace = true
rdp-companion-proto = { path = "../rdp-companion-proto" }
rdp-vfiles = { path = "../rdp-vfiles" }
tracing = "0.1"
windows-core = "0.62"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # Tests run on a private window station (it has its own clipboard).
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
