[package]
name = "rdp-companion"
description = "Remote-side companion for RDP App: runs inside the session and attaches over a dynamic virtual channel."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rdp-companion"
path = "src/main.rs"

[dependencies]
rdp-companion-proto = { path = "../rdp-companion-proto" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

# Profiles live in the workspace root; a size-tuned build for deployment comes later.
