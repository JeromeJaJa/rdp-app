[package]
name = "rdp-companion"
description = "Remote-side companion for RDP App: runs inside the session and attaches over a dynamic virtual channel."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rdp-companion"
path = "src/main.rs"

[dependencies]
rdp-companion-proto = { path = "../rdp-companion-proto" }
rdp-direct = { path = "../rdp-direct" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
rdp-vfiles = { path = "../rdp-vfiles" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    # Tests run the clipboard on a private window station (it has its own clipboard).
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Profiles live in the workspace root; a size-tuned build for deployment comes later.
