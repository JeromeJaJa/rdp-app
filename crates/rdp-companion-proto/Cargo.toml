[package]
name = "rdp-companion-proto"
description = "Wire protocol shared by the RDP App client and the remote-side companion."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_bytes = "0.11"
sha2 = "0.10"
# Already in the tree through IronRDP; compresses transfer chunks.
zstd-safe = "7.2"
