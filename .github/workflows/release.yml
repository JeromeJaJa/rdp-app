name: Release

# Push a tag matching the app version to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# It runs the CI checks first, then builds; nothing is built or published if they fail.
# Its notes list the commits since the previous release (scripts/release-notes.mjs).
# Run it by hand (Actions → Release → Run workflow) to build the same files as a
# downloadable artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  windows:
    name: Build (Windows x64)
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags: the notes list the commits since the last release.
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match the app version $version (src-tauri/tauri.conf.json)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # The H.264 decoder's SIMD assembly needs NASM; without it the codec quietly builds
      # without assembly and decodes far slower. Fail instead of shipping that.
      - uses: ilammy/setup-nasm@v1

      - name: Check NASM
        run: nasm -v

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Release builds don't share artifacts with CI's debug ones.
          shared-key: release

      - name: Install UI dependencies
        run: bun install --frozen-lockfile

      # Builds the companion, then the app and its installer with the companion bundled
      # next to the exe (src-tauri/tauri.release.conf.json), signed for the updater
      # (src-tauri/tauri.updater.conf.json: the .sig installed apps check updates against).
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "the TAURI_SIGNING_PRIVATE_KEY secret isn't set" }
          cargo build --release --locked -p rdp-companion
          if ($LASTEXITCODE -ne 0) { throw "companion build failed" }
          bunx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { throw "app build failed" }

      - name: Package
        run: |
          $v = "${{ steps.version.outputs.version }}"
          if (-not (Select-String -Path target/release/nsis/x64/installer.nsi -Pattern "rdp-companion.exe" -SimpleMatch -Quiet)) {
            throw "the installer doesn't include rdp-companion.exe"
          }
          $out = (New-Item -ItemType Directory -Force release-assets).FullName
          # This version's installer: the folder can hold older ones (from a cached build).
          $setup = Get-ChildItem "target/release/bundle/nsis/*_${v}_x64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer for $v not found" }
          # Only the installer: it puts rdp-companion.exe next to the app. A bare exe on its own
          # runs fine but can't install the companion, which looked like a broken feature.
          $installer = "RDP-App_${v}_x64-setup.exe"
          Copy-Item $setup.FullName "$out/$installer"

          # What changed: the commits since the previous release, grouped by kind. The release's
          # notes, and what installed apps show before updating.
          (bun scripts/release-notes.mjs $env:GITHUB_REF_NAME) -join "`n" | Set-Content changes.md
          if ($LASTEXITCODE -ne 0) { throw "couldn't list the changes" }

          # The update feed installed apps read (releases/latest/download/latest.json): this
          # version, its notes, and the installer with its signature.
          $sig = Get-Item "$($setup.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $sig) { throw "the installer isn't signed for the updater (no .sig)" }
          $platform = @{
            signature = (Get-Content $sig.FullName -Raw).Trim()
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$v/$installer"
          }
          [ordered]@{
            version = $v
            notes = (Get-Content changes.md -Raw).Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64-nsis" = $platform; "windows-x86_64" = $platform }
          } | ConvertTo-Json -Depth 5 | Set-Content "$out/latest.json" -Encoding utf8NoBOM
          $sums = Get-ChildItem $out | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Set-Content "$out/SHA256SUMS.txt"
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: rdp-app-${{ steps.version.outputs.version }}-windows-x64
          path: release-assets/*
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $changes = Get-Content changes.md -Raw
          @"
          Windows x64: download **RDP-App_${v}_x64-setup.exe** and run it. It installs per user (no admin needed) and installs WebView2 if it's missing. Installed apps update themselves from here (Settings → About).

          $changes

          The builds aren't code-signed yet, so Windows SmartScreen may warn on first run: choose **More info → Run anyway**. ``SHA256SUMS.txt`` lists the installer's checksum.
          "@ | Set-Content notes.md
          gh release create $env:GITHUB_REF_NAME release-assets/* --title "RDP App $env:GITHUB_REF_NAME" --notes-file notes.md
