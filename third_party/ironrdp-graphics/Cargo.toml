[package]
name = "ironrdp-graphics"
version = "0.9.0"
readme = "README.md"
description = "RDP image processing primitives"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"

[lib]
doctest = false
# test = false

[dependencies]
bit_field = "0.10"
bitflags = "2.11"
bitvec = "1.0"
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "62246b364a0282bab85087f658a81fe4207b6b31" } # public
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "62246b364a0282bab85087f658a81fe4207b6b31", features = ["std"] } # public
byteorder = "1.5" # TODO: remove
num-derive = "0.5" # TODO: remove
num-traits = "0.2" # TODO: remove
yuv = { version = "0.8", features = ["rdp"] }
wide = "0.7" # portable SIMD for the inverse DWT (wasm/x86/ARM); `std::simd` is still nightly-only

[dev-dependencies]
bmp = "0.5"
bytemuck = "1.24"
expect-test = "1"

