[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "MIT"

[workspace.dependencies]
# IronRDP is pinned to a git revision: crates.io releases lag behind important
# EGFX/AVC420 fixes on master.
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-session = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-input = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-rdpsnd-native = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-rdpdr = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-rdpdr-native = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-rdpeai = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-mstsgu = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "fbf25998630e1692dbea5479e33820cf0bd70acb" }

[profile.dev]
# Codecs are unusably slow unoptimized; keep our own code debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind" # sessions are isolated with catch_unwind
strip = true
